version: "3.8"

services:
  cstp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cstp-server
    ports:
      - "${CSTP_PORT:-8100}:8100"
    env_file:
      - .env
    environment:
      - CHROMA_URL=http://chromadb:8000
      # CSTP_STORAGE defaults to sqlite (F058). Keep the database inside the
      # already-persistent decisions volume: the default path is /app/data, which
      # is NOT mounted, so decisions would live in the container layer and vanish
      # on recreate. Co-locating it with the YAML files also lets the startup
      # YAML→SQLite auto-migration find them.
      - CSTP_DB_PATH=${CSTP_DB_PATH:-/app/decisions/decisions.db}
      # The rest of the server's state has the same problem: graph edges are
      # stored only in this JSONL file (SQLite holds none), circuit breakers
      # default to /app/data, and the F055 evidence chain and bundles default to
      # the user's home directory. None of those is mounted.
      - GRAPH_DATA_PATH=${GRAPH_DATA_PATH:-/app/decisions/graph_edges.jsonl}
      - CIRCUIT_BREAKER_DATA_PATH=${CIRCUIT_BREAKER_DATA_PATH:-/app/decisions/circuit_breakers.jsonl}
      - PROVENANCE_DB=${PROVENANCE_DB:-/app/decisions/provenance.db}
      - PROVENANCE_BUNDLE_DIR=${PROVENANCE_BUNDLE_DIR:-/app/decisions/bundles}
    volumes:
      - ./config:/app/config:ro
      - ./guardrails:/app/guardrails:ro
      - decisions_data:/app/decisions
    depends_on:
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - cstp-network

  chromadb:
    image: chromadb/chroma:0.4.22
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
      - ALLOW_RESET=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - cstp-network

volumes:
  chroma_data:
    driver: local
  decisions_data:
    driver: local

networks:
  cstp-network:
    driver: bridge
